<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Palace - Ali Özdem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent cursor-pointer" onclick="showSection('home')">
                👑 Joke Palace (Ali Özdem)
            </h1>
            <nav id="nav-auth" class="flex gap-3">
                <button onclick="showSection('login')" class="px-4 py-2 text-sm bg-slate-700 hover:bg-slate-600 rounded-lg transition">Giriş Yap</button>
                <button onclick="showSection('register')" class="px-4 py-2 text-sm bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg transition">Kayıt Ol</button>
            </nav>
            <div id="nav-user" class="hidden flex items-center gap-4">
                <span id="user-display-name" class="text-sm font-medium text-amber-400"></span>
                <button onclick="logout()" class="px-3 py-1.5 text-xs bg-rose-500/20 text-rose-400 border border-rose-500/30 hover:bg-rose-500/30 rounded-lg transition">Çıkış Yap</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">

        <!-- Home Section (Jokes Feed) -->
        <section id="section-home" class="space-y-6">
            <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                <h2 class="text-lg font-semibold text-slate-200">En Komik Espriler</h2>
                <button onclick="checkAuthAndOpenPost()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold text-sm rounded-lg shadow-lg transition flex items-center gap-2">
                    ✨ Espri Paylaş
                </button>
            </div>
            <div id="jokes-container" class="space-y-4">
                <!-- Espriler buraya dinamik olarak gelecek -->
                <p class="text-center text-slate-500 py-8">Espriler yükleniyor...</p>
            </div>
        </section>

        <!-- Login Section -->
        <section id="section-login" class="hidden max-w-md mx-auto bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl mt-10">
            <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">Giriş Yap</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Kullanıcı Adı</label>
                    <input type="text" id="login-username" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-slate-100 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Şifre</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-slate-100 text-sm">
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition shadow-lg mt-2">Giriş Yap</button>
            </form>
            <p class="text-center text-sm text-slate-400 mt-4">Hesabın yok mu? <a href="#" onclick="showSection('register')" class="text-amber-400 hover:underline">Kayıt Ol</a></p>
        </section>

        <!-- Register Section -->
        <section id="section-register" class="hidden max-w-md mx-auto bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl mt-10">
            <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">Kayıt Ol</h2>
            <form onsubmit="handleRegister(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Kullanıcı Adı</label>
                    <input type="text" id="register-username" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-slate-100 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Şifre</label>
                    <input type="password" id="register-password" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-slate-100 text-sm">
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition shadow-lg mt-2">Kayıt Ol</button>
            </form>
            <p class="text-center text-sm text-slate-400 mt-4">Zaten hesabın var mı? <a href="#" onclick="showSection('login')" class="text-amber-400 hover:underline">Giriş Yap</a></p>
        </section>

        <!-- Post Joke Section -->
        <section id="section-post" class="hidden max-w-lg mx-auto bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl mt-10">
            <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">Yeni Espri Paylaş</h2>
            <form onsubmit="handlePostJoke(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Espri İçeriği</label>
                    <textarea id="joke-content" rows="4" required placeholder="Esprini buraya yaz..." class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-slate-100 text-sm"></textarea>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="showSection('home')" class="w-1/2 py-3 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold rounded-xl transition">İptal</button>
                    <button type="submit" class="w-1/2 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition shadow-lg">Paylaş</button>
                </div>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800/50 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Joke Palace - Tüm Hakları Saklıdır. (Ali Özdem Alanı)
    </footer>

    <!-- Supabase Logic & App Script -->
    <script>
        // Supabase Bağlantı Bilgileri (Doğrulandı)
        const SUPABASE_URL = 'https://xavwlojjgvxgeybqljyn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sHrgA7j7ZokBJDrkmAendw_EiTUH40b';

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Uygulama Durumu
        let currentUser = JSON.parse(localStorage.getItem('jp_user')) || null;

        // Sayfa Yüklendiğinde Çalışacaklar
        window.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            fetchJokes();
        });

        // Sayfa / Sekme Değiştirme Fonksiyonu
        function showSection(sectionId) {
            ['home', 'login', 'register', 'post'].forEach(id => {
                document.getElementById(`section-${id}`).classList.add('hidden');
            });
            document.getElementById(`section-${sectionId}`).classList.remove('hidden');
            if (sectionId === 'home') {
                fetchJokes();
            }
        }

        // Arayüzü Kullanıcı Durumuna Göre Güncelleme
        function updateAuthUI() {
            const navAuth = document.getElementById('nav-auth');
            const navUser = document.getElementById('nav-user');
            const displayName = document.getElementById('user-display-name');

            if (currentUser) {
                navAuth.classList.add('hidden');
                navUser.classList.remove('hidden');
                displayName.textContent = `${currentUser.username} ${currentUser.is_admin ? '👑' : ''}`;
            } else {
                navAuth.classList.remove('hidden');
                navUser.classList.add('hidden');
            }
        }

        // Çıkış Yap
        function logout() {
            localStorage.removeItem('jp_user');
            currentUser = null;
            updateAuthUI();
            showSection('home');
        }

        // Kayıt Ol Fonksiyonu
        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value.trim();

            // Ali Özdem hesaplarına otomatik admin yetkisi verme kontrolü
            const isAdmin = username.toLowerCase() === 'ali özdem' || username.toLowerCase() === 'aliozdem';

            try {
                const { data, error } = await db
                    .from('users')
                    .insert([{ username, password, is_admin: isAdmin }])
                    .select();

                if (error) throw error;

                alert('Kayıt başarılı! Şimdi giriş yapabilirsiniz.');
                showSection('login');
            } catch (err) {
                alert('Kayıt olurken hata oluştu: ' + (err.message || 'Bilinmeyen hata'));
            }
        }

        // Giriş Yap Fonksiyonu
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                const { data, error } = await db
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    alert('Geçersiz kullanıcı adı veya şifre!');
                    return;
                }

                currentUser = data;
                localStorage.setItem('jp_user', JSON.stringify(currentUser));
                updateAuthUI();
                showSection('home');
            } catch (err) {
                alert('Giriş yapılırken hata oluştu. Lütfen tekrar deneyin.');
            }
        }

        // Espri Paylaşma Sayfasına Geçiş Kontrolü
        function checkAuthAndOpenPost() {
            if (!currentUser) {
                alert('Espri paylaşmak için önce giriş yapmalısınız!');
                showSection('login');
                return;
            }
            showSection('post');
        }

        // Espri Gönder
        async function handlePostJoke(event) {
            event.preventDefault();
            if (!currentUser) return;

            const content = document.getElementById('joke-content').value.trim();

            try {
                const { error } = await db
                    .from('jokes')
                    .insert([{ content, user_id: currentUser.id, username: currentUser.username }]);

                if (error) throw error;

                document.getElementById('joke-content').value = '';
                showSection('home');
            } catch (err) {
                alert('Espri paylaşılamadı: ' + (err.message || 'Bilinmeyen hata'));
            }
        }

        // Esprileri Listele
        async function fetchJokes() {
            const container = document.getElementById('jokes-container');
            container.innerHTML = '<p class="text-center text-slate-500 py-8">Espriler yükleniyor...</p>';

            try {
                const { data, error } = await db
                    .from('jokes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center text-slate-500 py-8">Henüz hiç espri paylaşılmamış. İlk sen ol!</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(joke => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md space-y-3';
                    
                    const isAliAdmin = joke.username && (joke.username.toLowerCase() === 'ali özdem' || joke.username.toLowerCase() === 'aliozdem');

                    card.innerHTML = `
                        <p class="text-slate-100 text-base whitespace-pre-wrap">${escapeHTML(joke.content)}</p>
                        <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-700/50">
                            <span class="font-medium text-amber-400">@${escapeHTML(joke.username || 'Anonim')} ${isAliAdmin ? '👑' : ''}</span>
                            <span>${new Date(joke.created_at).toLocaleString('tr-TR')}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = '<p class="text-center text-rose-400 py-8">Espriler yüklenirken bir hata oluştu.</p>';
            }
        }

        // Basit Güvenlik (XSS koruması)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
