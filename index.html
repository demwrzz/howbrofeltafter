<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Beyin Esprileri</title>
    <style>
        /* Genel Sayfa Tasarımı */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f, #252542);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #ffdf00;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .espri-kutusu {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #ff4757;
        }

        .soru {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 10px;
        }

        .cevap {
            font-size: 1.5rem;
            color: #2ed573;
            font-weight: bold;
        }

        .random-text {
            font-style: italic;
            color: #a4b0be;
            margin-top: 20px;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Yukarıdan Düşen Emojilerin Animasyon Ayarları */
        .emoji {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            animation: dusme linear infinite;
        }

        @keyframes dusme {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ali Beyin Esprileri</h1>
        
        <div class="espri-kutusu">
            <p class="soru">Espri 1: Kadın otobüste hamile kalmış neden?</p>
            <p class="cevap">Paso vermiş! 🚌😂</p>
        </div>

        <div class="random-text">
            <p>Mikasaaaaaa yambalı bozzey...</p>
        </div>
    </div>

    <!-- Emojileri Yağdıran JavaScript Kodu -->
    <script>
        const emojiler = ['😂', '🤣', '😆', '😄', '💀', '🎈'];
        
        function emojiOlustur() {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji');
            
            // Rastgele bir emoji seçimi
            emoji.innerText = emojiler[Math.floor(Math.random() * emojiler.length)];
            
            // Ekranın rastgele bir yatay konumundan düşmesini sağla
            emoji.style.left = Math.random() * 100 + 'vw';
            
            // Düşüş hızını pürüzsüzlük için rastgele ayarla (4 ile 8 saniye arası)
            const sure = Math.random() * 4 + 4;
            emoji.style.animationDuration = sure + 's';
            
            // Emojilerin boyutunu rastgele hafifçe değiştir
            emoji.style.fontSize = Math.random() * 1.5 + 1.5 + 'rem';
            
            document.body.appendChild(emoji);
            
            // Ekranın altına ulaşan emojileri sil (hafızayı şişirmesin)
            setTimeout(() => {
                emoji.remove();
            }, sure * 1000);
        }

        // Her 300 milisaniyede bir yeni emoji yukarıdan düşmeye başlar
        setInterval(emojiOlustur, 300);
    </script>

</body>
</html>
